name: Ubuntu Builds

on:
  push:
    paths:
      - '.github/workflows/build-ubuntu.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'examples/**'
      - 'include/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/build-ubuntu.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'examples/**'
      - 'include/**'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        build:
          - compiler: g++-9
            linker: GOLD
          - compiler: clang++-11
            linker: LLD
        config:
          # Release build
          - build_type: Release
          # Debug builds
          - build_type: Debug
            valgrind: ON
          - build_type: Debug
            sanitize: address,undefined

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        if: ${{matrix.build.compiler == 'g++-9'}}
        run: sudo apt-get install -y g++-9

      - name: Install Clang
        if: ${{matrix.build.compiler == 'clang++-11'}}
        run: sudo apt-get install -y clang-11 lld-11

      - name: Install Valgrind
        if: ${{matrix.config.valgrind == 'ON'}}
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Configure CMake
        working-directory: ${{runner.workspace}}
        env:
          CXX: ${{matrix.build.compiler}}
        run: |
          cmake -S ${{github.event.repository.name}} -B build \
                -DCMAKE_CONFIGURATION_TYPES=${{matrix.config.build_type}} \
                -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} \
                -DCMAKE_LINKER_TYPE=${{matrix.build.linker}} \
                -DCPPSORT_SANITIZE=${{matrix.config.sanitize}} \
                -DCPPSORT_USE_VALGRIND=${{matrix.config.valgrind}} \
                -DCPPSORT_BUILD_EXAMPLES=ON \
                -G"Unix Makefiles"

      - name: Build the test suite
        shell: bash
        working-directory: ${{runner.workspace}}/build
        env: # Note: clang bug with sanitizers, remove after upgrading
          ASAN_OPTIONS: "use_sigaltstack=false"
          UBSAN_OPTIONS: "use_sigaltstack=false"
        run: cmake --build . --config ${{matrix.config.build_type}} -j 2

      - name: Run the test suite
        if: ${{matrix.config.valgrind != 'ON'}}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          # Note: clang bug with sanitizers, remove after upgrading
          ASAN_OPTIONS: "use_sigaltstack=false"
          UBSAN_OPTIONS: "use_sigaltstack=false"
        working-directory: ${{runner.workspace}}/build
        run: ctest -C ${{matrix.config.build_type}}

      - name: Run the test suite with Memcheck
        if: ${{matrix.config.valgrind == 'ON'}}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        working-directory: ${{runner.workspace}}/build
        run: ctest -T memcheck -C ${{matrix.config.build_type}} --no-tests=error -j 2

      - name: Show Valgrind logs
        if: ${{failure() && matrix.config.valgrind == 'ON'}}
        working-directory: ${{runner.workspace}}/build
        run: find ./Testing/Temporary -name "MemoryChecker.*.log" -size +1300c | xargs cat
